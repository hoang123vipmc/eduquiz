<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="oqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="30" fill="url(#oqGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="28" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Bold OQ Logo text -->
  <text x="54" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">OQ</text>

  <!-- Golden Graduation Cap on Q -->
  <g transform="translate(80, 24) scale(0.38)" filter="url(#glow)">
    <!-- Cap top diamond -->
    <path d="M50 15 L95 38 L50 60 L5 38 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3" />
    <!-- Cap skull base -->
    <path d="M22 46 L22 68 C22 80 78 80 78 68 L78 46" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <!-- Tassel hanging down -->
    <path d="M92 40 L102 65 L98 88" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <circle cx="98" cy="88" r="4.5" fill="#f59e0b" />
    <!-- Star sparkle -->
    <path d="M105 10 Q105 18 113 18 Q105 18 105 26 Q105 18 97 18 Q105 18 105 10 Z" fill="#fef08a" />
  </g>
</svg>
